name: Publish to PyPI

# Uploads the wheel (library + CLI, no sdist) to PyPI through Trusted
# Publishing: PyPI accepts the GitHub OIDC token of this file, in the
# environment `pypi`, and no API token is stored in the repo. The environment
# requires the maintainer's approval; approve once ci.yml passed on the tag.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: false

      # PyPI versions can never be reused, so a tag that disagrees with
      # pyproject.toml must not get that far.
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(uv version --short)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Build
        run: uv build --wheel

      # Same check as ci.yml: a clean install, outside the repo, with an
      # empty home, catches files missing from the wheel and run-time downloads.
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/wheel-venv
          VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
          mkdir /tmp/wheel-home /tmp/wheel-run && cd /tmp/wheel-run
          HOME=/tmp/wheel-home /tmp/wheel-venv/bin/accuratum --lat-long=-15.78,-47.92 --year 2026 \
            --line-points 50 --time-step 60 -o out.pdf
          test -s out.pdf

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/accuratum
    permissions:
      id-token: write # only this job can mint the OIDC token PyPI trusts

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
