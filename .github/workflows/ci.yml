name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

# Read-only by default; `release` and `pypi` widen it for themselves.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pinned binary instead of gitleaks-action (which needs a license for organizations).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Scan history
        run: ./gitleaks git --redact -v --no-banner --log-opts=--all .

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  test-web:
    name: Test website (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-packages --extra dev --group dev

      - name: Run tests
        run: cd web && uv run pytest

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"

      # PyPI versions can never be reused, so a tag that disagrees with
      # pyproject.toml must not get that far.
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(uv version --short)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Build
        run: uv build

      # A clean install, outside the repo, with an empty home: catches files
      # missing from the wheel (accuratum/fig/) and any run-time download.
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/wheel-venv
          VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
          mkdir /tmp/wheel-home /tmp/wheel-run && cd /tmp/wheel-run
          HOME=/tmp/wheel-home /tmp/wheel-venv/bin/accuratum --lat-long=-15.78,-47.92 --year 2026 \
            --line-points 50 --time-step 60 -o out.pdf
          test -s out.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Trusted Publishing: PyPI accepts the GitHub OIDC token of this file (ci.yml)
  # in the environment `pypi`, so no API token is stored in the repo. It runs
  # after `build`, which waits for `test` and `lint`.
  pypi:
    name: Upload wheel to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/accuratum
    permissions:
      id-token: write # only this job can mint the OIDC token PyPI trusts

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Wheel only (library + CLI); the sdist stays on the GitHub Release.
      - name: Keep only the wheel
        run: rm dist/*.tar.gz

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
