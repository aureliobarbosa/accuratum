# Lets Claude work on issues and pull requests, always on its own branch.
#
# Start it by adding the `agent` label to an issue, or by writing `@claude …`
# in an issue comment, a PR comment or a PR review. What it does then is in
# CLAUDE.md § Unattended agents: plan first, code after "@claude go", hand
# over a PR.
#
# Only the repository owner can start it (`if:` below, on top of the action's
# own write-access check). The repo is public: anyone can open an issue or
# comment, and that text must never start an agent. Don't summon it on a PR
# from someone else either: it would run their code (and their CLAUDE.md)
# with this workflow's secrets.
#
# Kept apart from deploy.yml and ci.yml for PERMISSIONS. This job runs
# commands an agent writes, so treat everything it can reach as exposed:
# - `id-token: write`: the action swaps the OIDC token for the Claude GitHub
#   App's token. Pushes made with the App's token trigger ci.yml on the PR;
#   pushes with GITHUB_TOKEN wouldn't. Google's identity provider trusts only
#   deploy.yml on site-v* tags (scripts/setup-gcp.sh), so this token opens
#   nothing in Google Cloud.
# - The App can push branches, but rulesets stop it at `main` and at the
#   `v*`/`site-v*` tags, and without the `workflows` permission it can't
#   change files in .github/workflows/.
# - `--allowedTools` saves permission prompts; it isn't a sandbox
#   (`uv run python …` runs anything).
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# One run per issue/PR at a time; a second comment waits for the first run.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'agent') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action trades it for the Claude GitHub App's token
      actions: read # lets Claude read CI results on its PR

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git log/blame for the agent; the repo is small

      # The same environment as ci.yml, so the agent runs the real checks.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-packages --extra dev --group dev

      - uses: anthropics/claude-code-action@v1
        with:
          # From `claude setup-token` (a Claude subscription). To bill an API
          # key instead, swap this for anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent
          additional_permissions: |
            actions: read
          claude_args: |
            --model opus
            --allowedTools "Bash(uv run:*),Bash(uv sync:*),Bash(uv lock:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rebase:*),Bash(git fetch:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(mkdir:*)"

      # Rendered output is approved by eye (CLAUDE.md § Checkpoints); the PNGs
      # stay out of git and ride along with the run instead.
      - name: Upload rendered PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-out
          path: agent-out/
          if-no-files-found: ignore
          retention-days: 30
