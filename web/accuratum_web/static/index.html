<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accuratum</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Accuratum</a>
    <nav class="nav">
      <a href="#/" data-i18n="nav.home"></a>
      <a href="#/about" data-i18n="nav.about"></a>
      <a href="#/contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="topbar-end">
      <label class="visually-hidden" for="lang" data-i18n="nav.language"></label>
      <select id="lang">
        <option value="pt-BR">PT</option>
        <option value="en">EN</option>
      </select>
      <a class="github" href="https://github.com/aureliobarbosa/accuratum" rel="noopener" data-i18n-title="nav.github">
        <svg viewBox="0 0 16 16" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <main>
    <!-- 1. Landing -->
    <section id="view-home" class="view">
      <div class="hero">
        <div class="logo-placeholder" aria-hidden="true">☉</div>
        <h1>Accuratum</h1>
        <p class="tagline" data-i18n="home.tagline"></p>
        <a class="button primary" href="#/location" data-i18n="home.generate"></a>
      </div>
      <div class="gallery" id="gallery" hidden></div>
    </section>

    <!-- 2. Location -->
    <section id="view-location" class="view" hidden>
      <h2 data-i18n="location.heading"></h2>
      <form id="search-form" class="search">
        <label class="visually-hidden" for="search-q" data-i18n="location.search"></label>
        <input id="search-q" type="search" maxlength="200" data-i18n-placeholder="location.searchPlaceholder">
        <button type="submit" class="button" data-i18n="location.search"></button>
      </form>
      <ul id="search-results" class="search-results"></ul>
      <p id="search-status" class="status" role="status"></p>
      <div id="map" class="map"></div>
      <p id="place" class="place" role="status"></p>
      <div class="actions">
        <a class="button" href="#/" data-i18n="common.back"></a>
        <button id="to-details" class="button primary" type="button" disabled data-i18n="common.next"></button>
      </div>
    </section>

    <!-- 3. Details -->
    <section id="view-details" class="view" hidden>
      <h2 data-i18n="details.heading"></h2>
      <form id="details-form">
        <fieldset>
          <legend data-i18n="details.shared"></legend>
          <label><span data-i18n="details.year"></span>
            <input name="year" type="number" min="1901" max="2100" required></label>
          <label><span data-i18n="details.daylineColor"></span>
            <input name="dayline_color" type="color" value="#d55e00"></label>
          <label><span data-i18n="details.hourlineColor"></span>
            <input name="hourline_color" type="color" value="#0072b2"></label>
          <div class="image-choice" data-name="logo">
            <span data-i18n="details.logo"></span>
            <img class="thumb" alt="" src="api/default-image/logo">
            <label class="button"><span data-i18n="details.customizeLogo"></span>
              <input type="file" accept="image/png,image/jpeg" class="visually-hidden"></label>
            <button type="button" class="button reset" data-i18n="details.useDefault"></button>
          </div>
          <div class="image-choice" data-name="compass">
            <span data-i18n="details.compass"></span>
            <img class="thumb" alt="" src="api/default-image/compass">
            <label class="button"><span data-i18n="details.customizeCompass"></span>
              <input type="file" accept="image/png,image/jpeg" class="visually-hidden"></label>
            <button type="button" class="button reset" data-i18n="details.useDefault"></button>
          </div>
        </fieldset>
        <div class="periods">
          <fieldset data-period="0">
            <legend data-i18n="details.period0"></legend>
            <label><span data-i18n="details.title"></span>
              <input name="title0" maxlength="80"></label>
            <label><span data-i18n="details.subtitle"></span>
              <input name="subtitle0" maxlength="80"></label>
          </fieldset>
          <fieldset data-period="1">
            <legend data-i18n="details.period1"></legend>
            <label><span data-i18n="details.title"></span>
              <input name="title1" maxlength="80"></label>
            <label><span data-i18n="details.subtitle"></span>
              <input name="subtitle1" maxlength="80"></label>
          </fieldset>
        </div>
        <p id="details-status" class="status" role="alert"></p>
        <div class="actions">
          <a class="button" href="#/location" data-i18n="common.back"></a>
          <button id="generate" class="button primary" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span data-i18n="common.next"></span>
          </button>
        </div>
      </form>
    </section>

    <!-- 4. Result -->
    <section id="view-result" class="view" hidden>
      <h2 data-i18n="result.heading"></h2>
      <div class="previews">
        <figure><img id="preview0" alt=""><figcaption data-i18n="details.period0"></figcaption></figure>
        <figure><img id="preview1" alt=""><figcaption data-i18n="details.period1"></figcaption></figure>
      </div>
      <div class="actions">
        <a class="button" href="#/details" data-i18n="common.back"></a>
        <a id="download" class="button primary" data-i18n="result.download"></a>
      </div>
    </section>

    <section id="view-about" class="view" hidden>
      <h2 data-i18n="nav.about"></h2>
      <p data-i18n="common.wip"></p>
    </section>

    <section id="view-contact" class="view" hidden>
      <h2 data-i18n="nav.contact"></h2>
      <p data-i18n="common.wip"></p>
    </section>
  </main>
</body>
</html>
